name: Sync disease data

on:
  schedule:
    # Weekly Monday sync at 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: disease-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Ingest upstream snapshots
        run: |
          python3 scripts/ingest_bulk.py
          python3 scripts/ingest_pathway_sources.py

      - name: Validate catalog
        run: python3 scripts/validate_catalog.py

      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bulk
          if git diff --cached --quiet; then
            echo "No upstream data changes."
          else
            git commit -m "Sync disease data snapshots"
            git push
          fi
